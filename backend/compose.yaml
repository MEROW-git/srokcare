services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fixkh
      POSTGRES_USER: ${DB_USERNAME:-fixkh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fixkh} -d fixkh"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
